# Merged onto reader-ergonomics' own config, table by table; a value here wins (extending.md, the interface).
# Only the values that change are written.
extends = "reader-ergonomics"

# The standard's generated files, and the answers file: it changes with every file it answers for, so it co-changes
# by construction, as the bibliography changes with every review.
[co_change]
exempt = ["standard.md", "llms.txt", "evidence/bibliography.md", "checks/judgments.toml"]

# The site loads the standard's own stylesheet (_standard/site.css, checked out in pages.yml), so there is none here
# to measure; reader-ergonomics extending.md asks such an extension to list none.
[readable_measure]
stylesheets = []

[sufficient_contrast]
stylesheets = []

[bibliography_keys]
# A key names one work across the family (reader-ergonomics decision 0003); CI clones each name beside this repository.
family = ["reader-ergonomics", "reader-ergonomics-academic", "reader-ergonomics-presentations",
          "reader-ergonomics-software-design", "reader-ergonomics-topic"]
shared_links = []


# The checks of the study shapes (checks/local, shapes/README.md). Each names the files it reads; another repository
# that uses the shapes names its own.
[lesson]
files = ["shapes/examples/*-lesson.md", "shapes/examples/*-guide.md"]
objective_headings = ["Objectives"]
check_headings = ["Check yourself"]
trap_labels = ["Trap"]
why_labels = ["Why not"]
min_answer_words = 8   # PROVISIONAL: fewer words is a bare key; no study sets the length of an explanation
options = [3, 4]       # PROVISIONAL: three is best for tests (Rodriguez 2005), not shown for learning
question_prefixes = ["Check:"]   # a callout question, as the S7 vault writes it

# The same rules on notes, which state no objectives (checks/local/questions.py); this repository declares none.
[questions]
files = []

[sheet]
files = ["shapes/examples/*-sheet.md"]
types_headings = ["Types"]
mixed_headings = ["Mixed review"]
hint_labels = ["Hint"]
answer_labels = ["Answer"]
solution_labels = ["Solution"]
mixed_types = 2   # PROVISIONAL: no study sets the share of mixed review in a set
max_block = 4     # PROVISIONAL: nine problems of a type did no better than three, in one lab study (Rohrer 2006, secondary)

[deck]
files = ["shapes/examples/*.tsv"]
long_answer = 25  # PROVISIONAL: the practitioner rules ask for short answers and give no number
list_items = 3    # PROVISIONAL

# The headings each shape requires, checked by the standard; the decision record's entry is the standard's own,
# repeated because a table here replaces the standard's.
[shape_conformance]
shapes = [
  { name = "decision record", files = ["decisions/0*.md"], required = ["Context", "Decision", "Consequences", "See also"] },
  { name = "lesson", files = ["shapes/examples/*-lesson.md"], required = ["Objectives", "Terms", "Check yourself", "Key points", "See also"] },
  { name = "exercise sheet", files = ["shapes/examples/*-sheet.md"], required = ["Types", "Mixed review", "See also"] },
  { name = "deck", files = ["shapes/examples/*-deck.md"], required = ["Use", "Sections", "See also"] },
  { name = "study guide", files = ["shapes/examples/*-guide.md"], required = ["How to use", "Objectives", "Check yourself", "Error grid", "Redo on", "Method sheet", "See also"] },
]

# The topic check of reader-ergonomics-topic, copied from its pinned commit at run time (checks.yml), never committed:
# the front page, the shapes, their examples and the decisions form one tree of topics. The evidence folders, written
# to the review contract, are not declared.
[topic]
files = ["README.md", "shapes/", "decisions/"]
root = "README.md"
exempt = []
summary_words = 60   # PROVISIONAL: the topic's own bound
listing_words = 3    # PROVISIONAL
summary_labels = ["summary", "abstract", "short description", "decision"]
summary_within = 4   # PROVISIONAL
typed = []
shapes = { lesson = ["shapes/examples/*-lesson.md"], exercise-sheet = ["shapes/examples/*-sheet.md"], deck = ["shapes/examples/*-deck.md"], study-guide = ["shapes/examples/*-guide.md"] }

# Each shape shows a filled example of itself: the standard's shape-example check, from v1.7.0; the shapes of this
# repository exempt two files more than the standard does.
[shape_example]
files = ["shapes/*.md"]
exempt = ["shapes/README.md", "shapes/question-block.md", "shapes/examples/"]   # the question block is a part, shown in the lesson
# example; the examples are instances, not shapes ("shapes/*.md" also matches files in subfolders)
